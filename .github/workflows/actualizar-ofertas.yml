name: Actualizar ofertas de empleo

on:
  schedule:
    # 08:00, 14:00 y 20:00 hora de Madrid (UTC+2 en verano / UTC+1 en invierno)
    # Definido en UTC: 06:00, 12:00, 18:00
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch: {} # permite lanzarlo manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Buscar ofertas reales en Adzuna
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: node scripts/fetch-jobs.mjs

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ofertas.json
          git diff --quiet --cached || git commit -m "Actualización automática de ofertas $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
